name: beon-ipquality

x-app-environment: &app-environment
  APP_ENV: production
  LOG_LEVEL: ${LOG_LEVEL:-info}
  DB_HOST: postgres
  DB_PORT: "5432"
  DB_USER: ${POSTGRES_USER:-beon}
  DB_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
  DB_NAME: ${POSTGRES_DB:-ipquality}
  DB_SSL_MODE: disable
  API_AUTH_ENABLED: "true"
  API_KEY: ${API_KEY:?set API_KEY with at least 32 characters in .env}
  ADMIN_API_KEY: ${ADMIN_API_KEY:-}
  TRUSTED_PROXIES: ${TRUSTED_PROXIES:-}
  API_CORS_ENABLED: "false"
  REDIS_ENABLED: "true"
  REDIS_HOST: redis
  REDIS_PORT: "6379"
  REDIS_PASSWORD: ${REDIS_PASSWORD:?set REDIS_PASSWORD in .env}
  MMDB_PATH: /app/data/mmdb/reputation.mmdb
  MMDB_OUTPUT: /app/data/mmdb/reputation.mmdb
  GEOIP_CITY_PATH: /app/data/mmdb/GeoLite2-City.mmdb
  GEOIP_ASN_PATH: /app/data/mmdb/GeoLite2-ASN.mmdb

x-app-build: &app-build
  context: .
  dockerfile: Dockerfile
  args:
    VERSION: ${VERSION:-dev}
    BUILD_TIME: ${BUILD_TIME:-unknown}

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-beon}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-ipquality}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./migrations/001_initial_schema.sql:/docker-entrypoint-initdb.d/001_initial_schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [beon-network]

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?set REDIS_PASSWORD in .env}
    command: ["redis-server", "--appendonly", "yes", "--requirepass", "${REDIS_PASSWORD:?set REDIS_PASSWORD in .env}", "--maxmemory", "512mb", "--maxmemory-policy", "allkeys-lru"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$${REDIS_PASSWORD}\" ping | grep PONG"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [beon-network]

  ingestor-init:
    build:
      <<: *app-build
      target: ingestor
    restart: "no"
    environment: *app-environment
    command: ["-config", "/app/configs/config.yaml", "-feeds", "/app/configs/feeds.yaml", "-once"]
    depends_on:
      postgres:
        condition: service_healthy
    networks: [beon-network]

  compiler-init:
    build:
      <<: *app-build
      target: compiler
    restart: "no"
    environment: *app-environment
    command: ["-config", "/app/configs/config.yaml", "-oneshot"]
    volumes:
      - mmdb_data:/app/data/mmdb
    depends_on:
      ingestor-init:
        condition: service_completed_successfully
    networks: [beon-network]

  api:
    build:
      <<: *app-build
      target: api
    restart: unless-stopped
    environment:
      <<: *app-environment
      SERVER_HOST: 0.0.0.0
      SERVER_PORT: "8080"
    volumes:
      - mmdb_data:/app/data/mmdb
    ports:
      - "${API_BIND_ADDRESS:-127.0.0.1}:${API_PORT:-8080}:8080"
    depends_on:
      compiler-init:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:8080/health"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [beon-network]

  ingestor:
    build:
      <<: *app-build
      target: ingestor
    restart: unless-stopped
    environment:
      <<: *app-environment
      INGESTOR_SKIP_INITIAL: "true"
    volumes:
      - mmdb_data:/app/data/mmdb
    depends_on:
      compiler-init:
        condition: service_completed_successfully
    networks: [beon-network]

  compiler:
    build:
      <<: *app-build
      target: compiler
    restart: unless-stopped
    command: ["-config", "/app/configs/config.yaml", "-skip-initial"]
    environment: *app-environment
    volumes:
      - mmdb_data:/app/data/mmdb
    depends_on:
      compiler-init:
        condition: service_completed_successfully
    networks: [beon-network]

  judge:
    build:
      <<: *app-build
      target: judge
    restart: unless-stopped
    environment:
      <<: *app-environment
      SERVER_HOST: 0.0.0.0
    ports:
      - "127.0.0.1:${JUDGE_PORT:-8081}:8081"
    profiles: [active-scanning]
    networks: [beon-network]

  clickhouse:
    image: clickhouse/clickhouse-server:24-alpine
    restart: unless-stopped
    environment:
      CLICKHOUSE_DB: ${CLICKHOUSE_DATABASE:-ipquality}
      CLICKHOUSE_USER: ${CLICKHOUSE_USER:-beon}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:-disabled-profile-change-me}
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: "1"
    volumes:
      - clickhouse_data:/var/lib/clickhouse
      - clickhouse_logs:/var/log/clickhouse-server
      - ./migrations/clickhouse/001_analytics_schema.sql:/docker-entrypoint-initdb.d/001_analytics_schema.sql:ro
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    healthcheck:
      test: ["CMD-SHELL", "clickhouse-client --user \"$${CLICKHOUSE_USER}\" --password \"$${CLICKHOUSE_PASSWORD}\" --query 'SELECT 1'"]
      interval: 10s
      timeout: 5s
      retries: 10
    profiles: [monitoring]
    networks: [beon-network]

  prometheus:
    image: prom/prometheus:v2.55.1
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=15d
    volumes:
      - ./configs/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    ports:
      - "127.0.0.1:${PROMETHEUS_PORT:-9090}:9090"
    profiles: [monitoring]
    networks: [beon-network]

  grafana:
    image: grafana/grafana:11.4.0
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:-disabled-profile-change-me}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_INSTALL_PLUGINS: grafana-clickhouse-datasource
      CLICKHOUSE_USER: ${CLICKHOUSE_USER:-beon}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:-disabled-profile-change-me}
    volumes:
      - grafana_data:/var/lib/grafana
      - ./configs/grafana/provisioning/datasources.yaml:/etc/grafana/provisioning/datasources/datasources.yaml:ro
      - ./configs/grafana/provisioning/dashboards.yaml:/etc/grafana/provisioning/dashboards/dashboards.yaml:ro
      - ./configs/grafana/dashboards:/etc/grafana/provisioning/dashboards:ro
    ports:
      - "127.0.0.1:${GRAFANA_PORT:-3000}:3000"
    depends_on:
      clickhouse:
        condition: service_healthy
    profiles: [monitoring]
    networks: [beon-network]

  redis-exporter:
    image: oliver006/redis_exporter:v1.67.0
    restart: unless-stopped
    environment:
      REDIS_ADDR: redis://redis:6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:?set REDIS_PASSWORD in .env}
    depends_on:
      redis:
        condition: service_healthy
    profiles: [monitoring]
    networks: [beon-network]

  postgres-exporter:
    image: prometheuscommunity/postgres-exporter:v0.16.0
    restart: unless-stopped
    environment:
      DATA_SOURCE_NAME: postgresql://${POSTGRES_USER:-beon}:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@postgres:5432/${POSTGRES_DB:-ipquality}?sslmode=disable
    depends_on:
      postgres:
        condition: service_healthy
    profiles: [monitoring]
    networks: [beon-network]

  geoip-updater:
    image: maxmindinc/geoipupdate:v7
    restart: unless-stopped
    environment:
      GEOIPUPDATE_ACCOUNT_ID: ${MAXMIND_ACCOUNT_ID:-configure-before-enabling-profile}
      GEOIPUPDATE_LICENSE_KEY: ${MAXMIND_LICENSE_KEY:-configure-before-enabling-profile}
      GEOIPUPDATE_EDITION_IDS: GeoLite2-City GeoLite2-ASN
      GEOIPUPDATE_FREQUENCY: "24"
    volumes:
      - mmdb_data:/usr/share/GeoIP
    profiles: [geoip]
    networks: [beon-network]

networks:
  beon-network:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
  mmdb_data:
  clickhouse_data:
  clickhouse_logs:
  prometheus_data:
  grafana_data:
