openapi: 3.1.0
info:
  title: BEON-IPQuality API
  version: 1.1.0-rc.1
  description: Default paths and production authentication. See API.md for configuration-dependent
    limits, admin access, and legacy fields.
servers:
- url: http://127.0.0.1:8080
security:
- LookupKey: []
paths:
  /health:
    get:
      operationId: health
      security: []
      responses:
        '200':
          description: Ready and fresh
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'
        '503':
          description: Unavailable or stale
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'
  /metrics:
    get:
      operationId: metrics
      security: []
      responses:
        '200':
          description: Prometheus exposition
          content:
            text/plain:
              schema:
                type: string
  /api/v1/check/{ip}:
    get:
      operationId: checkIP
      parameters:
      - name: ip
        in: path
        required: true
        schema:
          type: string
        description: Public IPv4 or IPv6 address
      responses:
        '200':
          description: IP reputation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IPCheck'
        '400': &id001
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401': &id002
          description: Missing or invalid API key
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '429': &id003
          description: Lookup quota exceeded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503': &id004
          description: Reputation unavailable or stale
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/v1/check/batch:
    post:
      operationId: checkBatch
      description: Default limit 100, configurable through api.batch_max_size. Invalid
        items use score -1; unavailable valid lookup fails the complete batch.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - ips
              properties:
                ips:
                  type: array
                  minItems: 1
                  items:
                    type: string
      responses:
        '200':
          description: Ordered batch results
          content:
            application/json:
              schema:
                type: object
                properties:
                  results:
                    type: array
                    items:
                      $ref: '#/components/schemas/IPCheck'
                  total_count:
                    type: integer
                  total_time_ms:
                    type: number
        '400': *id001
        '401': *id002
        '429': *id003
        '503': *id004
  /api/v1/stats:
    get:
      operationId: stats
      responses:
        '200':
          description: Process lifetime statistics
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Stats'
        '401': *id002
        '429': *id003
  /api/v1/cache/stats:
    get:
      operationId: cacheStats
      security:
      - AdminKey: []
      description: Internal only. Disabled with text/plain 404 when ADMIN_API_KEY
        is empty.
      responses:
        '200':
          description: Operation result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CacheStats'
        '401': *id002
        '404':
          description: Administration disabled
          content:
            text/plain:
              schema:
                type: string
        '500':
          description: Admin operation failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/v1/cache:
    delete:
      operationId: clearCache
      security:
      - AdminKey: []
      description: Internal only. Disabled with text/plain 404 when ADMIN_API_KEY
        is empty.
      responses:
        '200':
          description: Operation result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminResult'
        '401': *id002
        '404':
          description: Administration disabled
          content:
            text/plain:
              schema:
                type: string
        '500':
          description: Admin operation failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/v1/reload:
    post:
      operationId: reloadMMDB
      security:
      - AdminKey: []
      description: Internal only. Disabled with text/plain 404 when ADMIN_API_KEY
        is empty.
      responses:
        '200':
          description: Operation result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminResult'
        '401': *id002
        '404':
          description: Administration disabled
          content:
            text/plain:
              schema:
                type: string
        '500':
          description: Admin operation failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '400':
          description: Reload paths not configured
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
components:
  securitySchemes:
    LookupKey:
      type: apiKey
      in: header
      name: X-API-Key
    AdminKey:
      type: apiKey
      in: header
      name: X-API-Key
  schemas:
    Error:
      type: object
      properties:
        error:
          type: string
        message:
          type: string
        success:
          type: boolean
        max:
          type: integer
    IPCheck:
      type: object
      required:
      - ip
      - score
      - risk_score
      - risk_level
      - risky
      - cached
      - query_time_ms
      properties:
        ip:
          type: string
        score:
          type: integer
          minimum: -1
          maximum: 100
        risk_score:
          type: integer
          minimum: 0
          maximum: 100
        risk_level:
          type: string
          enum:
          - clean
          - low
          - medium
          - high
          - critical
          - error
          - invalid
        data_version:
          type: string
        query_time_ms:
          type: number
        risky:
          type: boolean
        proxy:
          type: boolean
        vpn:
          type: boolean
        tor:
          type: boolean
        datacenter:
          type: boolean
        botnet:
          type: boolean
        spam:
          type: boolean
        malware:
          type: boolean
        attacker:
          type: boolean
        whitelisted:
          type: boolean
        cached:
          type: boolean
        threat_types:
          type: array
          items:
            type: string
        sources:
          type: array
          items:
            type: string
        geo:
          type: object
          properties:
            country:
              type: string
            country_code:
              type: string
            region:
              type: string
            city:
              type: string
            latitude:
              type: number
            longitude:
              type: number
            timezone:
              type: string
            postal_code:
              type: string
        asn:
          type: object
          properties:
            asn:
              type: integer
            org:
              type: string
            name:
              type: string
            type:
              type: string
            asn_type:
              type: string
            country_code:
              type: string
            country:
              type: string
            risk_modifier:
              type: integer
        threats:
          type: array
          description: Legacy field, omitted in compiled MMDB responses
          items:
            type: object
    Snapshot:
      type:
      - object
      - 'null'
      properties:
        scoring_policy:
          type: string
          description: Versioned heuristic used to compile this snapshot; absent in legacy artifacts.
        version:
          type: string
        built_at:
          type: string
          format: date-time
        age_seconds:
          type: number
        stale:
          type: boolean
        feed_freshness_known:
          type: boolean
        feeds:
          type: array
          items:
            $ref: '#/components/schemas/FeedFreshness'
    FeedFreshness:
      type: object
      properties:
        feed:
          type: string
        source:
          type: string
        last_success:
          type: string
          format: date-time
        latest_status:
          type: string
        max_age_seconds:
          type: number
        stale:
          type: boolean
    Health:
      type: object
      properties:
        status:
          type: string
        version:
          type: string
        uptime:
          type: string
        timestamp:
          type: string
          format: date-time
        services:
          type: object
          additionalProperties:
            type: string
        snapshot:
          $ref: '#/components/schemas/Snapshot'
    Stats:
      type: object
      properties:
        total_requests:
          type: integer
        total_ips:
          type: integer
        avg_response_time_ms:
          type: number
        error_rate:
          type: number
        period:
          type: string
          const: process_lifetime
    CacheStats:
      type: object
      properties:
        enabled:
          type: boolean
        message:
          type: string
        stats:
          type: object
          properties:
            hits:
              type: number
            misses:
              type: number
            hit_rate:
              type: number
            keys:
              type: number
            memory_used_bytes:
              type: number
    AdminResult:
      type: object
      properties:
        success:
          type: boolean
        message:
          type: string
        changed:
          type: boolean
        data_version:
          type: string
