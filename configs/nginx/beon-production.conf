# Replace ipq.example.com and certificate paths on the VPS after DNS/ACME setup.
# Nginx is on the same host as Docker, API port stays loopback.
server {
    listen 80;
    listen [::]:80;
    server_name ipq.example.com;
    location ^~ /.well-known/acme-challenge/ { root /var/www/beon-acme; }
    location / { return 301 https://ipq.example.com$request_uri; }
}
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name ipq.example.com;
    ssl_certificate /etc/letsencrypt/live/ipq.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/ipq.example.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    location = /metrics { return 403; }
    location ^~ /metrics/ { return 403; }
    location = /grafana { return 308 /grafana/; }
    location ^~ /grafana/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
    }
    location ~ ^/(health$|api/v1/) {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
        proxy_cache off;
    }
    # Root page is hosted separately by the active Caddy deployment; Judge is optional.
    location / { return 404; }
}
